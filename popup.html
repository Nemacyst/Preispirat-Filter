<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Preispirat Filter</title>
    <style>
      :root {
        --primary: #1e3a8a;
        --primary-hover: #1e40af;
        --danger: #dc2626;
        --danger-hover: #b91c1c;
        --bg: #ffffff;
        --surface: #f8fafc;
        --border: #e2e8f0;
        --text: #0f172a;
        --muted: #64748b;
        --radius: 8px;
      }

      * { box-sizing: border-box; }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        width: 280px;
        padding: 16px;
        margin: 0;
        color: var(--text);
        background: var(--bg);
      }

      h1 {
        font-size: 15px;
        font-weight: 600;
        margin: 0 0 4px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      p.hint {
        font-size: 12px;
        color: var(--muted);
        margin: 0 0 14px;
        line-height: 1.4;
      }

      .row {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }

      input[type="text"] {
        flex: 1;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        font-size: 13px;
        outline: none;
        transition: border-color 0.15s;
      }

      input[type="text"]:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1);
      }

      button {
        padding: 8px 12px;
        border: none;
        border-radius: var(--radius);
        background: var(--primary);
        color: white;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s;
      }

      button:hover {
        background: var(--primary-hover);
      }

      #list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 240px;
        overflow-y: auto;
        padding-right: 2px;
      }

      #list::-webkit-scrollbar {
        width: 6px;
      }
      #list::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 3px;
      }

      .user-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 6px 10px;
        font-size: 13px;
      }

      .user-row button {
        background: transparent;
        color: var(--danger);
        padding: 2px 6px;
        font-size: 16px;
        line-height: 1;
        border-radius: 4px;
      }

      .user-row button:hover {
        background: #fee2e2;
        color: var(--danger-hover);
      }

      #empty {
        font-size: 12px;
        color: var(--muted);
        padding: 8px 0;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>🏴‍☠️ Preispirat Filter</h1>
    <p class="hint">
      Posts from these users are automatically hidden on preispirat.ch.
    </p>
    <div class="row">
      <input type="text" id="newUser" placeholder="Enter username…" />
      <button id="addBtn">Add</button>
    </div>
    <div id="list"></div>
    <div id="empty" style="display: none;">No users blocked yet.</div>
    <script src="popup.js"></script>
  </body>
</html>
